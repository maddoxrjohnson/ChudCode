name: ci

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      # The runner integration tests execute real Python; keep CI on the same minor the
      # tool targets locally.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: npm ci
      # The DockerRunner tests run only when the image is present; they never pull it.
      - run: docker pull -q python:3.12-slim
      - run: npm run format:check
      - run: npm run lint
      - run: npm run check
      - run: npm test
      # Audit only what ships: dev tooling never runs for users, and auditing it would
      # bury a real runtime finding under permanent noise.
      - name: Audit production dependencies
        run: npm run audit

  editor-bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run bundle:editor
      # The committed bundle must match what the pinned esbuild and CodeMirror produce.
      - run: git diff --exit-code -- assets/vendor

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: npm ci
      # Only Chromium: the page is a loopback tool, and one engine catches the bugs
      # that matter (editor input, SSE, dialogs) without tripling the job's time.
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e:browser -- e2e-artifacts
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: e2e-screenshots
          path: e2e-artifacts
          if-no-files-found: ignore
